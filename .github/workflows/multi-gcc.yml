name: Multi GCC
on:
  workflow_dispatch:
  push:
    branches:
    - master
    - test_workflow
    - multi-gcc-test
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-22.04
    steps:
    - name: Clean workspace
      run: |-
        echo "Cleaning up previous run"
        rm -rf "${{ github.workspace }}"
        mkdir -p "${{ github.workspace }}"
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init
    - name: Install toolchains
      run: |-
        sudo apt-get update
        sudo apt-get install -y libtinfo5
        bash .github/workflows/scripts/install_test_toolchains.sh
    - name: Build
      run: python3 .github/workflows/scripts/multi_gcc_build.py quick
  exhaustive:
    runs-on: ubuntu-22.04
    needs: quick
    steps:
    - name: Clean workspace
      run: |-
        echo "Cleaning up previous run"
        rm -rf "${{ github.workspace }}"
        mkdir -p "${{ github.workspace }}"
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init
    - name: Install toolchains
      run: |-
        sudo apt-get update
        sudo apt-get install -y libtinfo5
        bash .github/workflows/scripts/install_test_toolchains.sh
    - name: Build
      run: python3 .github/workflows/scripts/multi_gcc_build.py exhaustive
